services:
  db:
    image: postgres:15
    container_name: timetabling-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etec_horarios
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d etec_horarios"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./TimetablingBackend
    container_name: timetabling-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/etec_horarios
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./TimetablingFrontend
    container_name: timetabling-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # URL usada pelo Navegador (Client-side)
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
      # URL usada pelo Next.js (Server-side) 
      API_BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
